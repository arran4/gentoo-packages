name: Deploy Gentoo Overlays Static Site

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '17 0 * * *'  # Nightly
  workflow_dispatch:
    inputs:
      g2_version:
        description: 'g2 version to use'
        required: false
        default: 'latest'
        type: string
      timeout:
        description: 'Timeout in minutes'
        required: false
        default: 180
        type: number
      concurrency:
        description: 'Concurrency level for g2 overlays site generate'
        required: false
        default: 8
        type: number
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout || 180) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install g2
        uses: arran4/g2-action@v1
        with:
          version: ${{ inputs.g2_version || 'latest' }}

      - name: Generate static site
        env:
          GOMEMLIMIT: 5GiB
        run: |
          g2 overlays site generate -concurrency ${{ inputs.concurrency || 8 }} -smart-mode -profile -profile-out _site/profile.txt -out _site https://raw.githubusercontent.com/gentoo/api-gentoo-org/master/files/overlays/repositories.xml

      - name: Zip search data
        run: |
          cd _site/search/data
          zip -r ../../../search-data.zip ./*.json
          cp ../../../search-data.zip ../../search-data.zip

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"


      - name: Increment Tag
        id: tag
        uses: arran4/git-tag-inc-action@v1
        with:
          action: '-repeating patch'

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --tags
          TAG=$(git describe --tags --abbrev=0)
          gh release create "$TAG" search-data.zip --title "Release $TAG" --notes "Automated release of search data"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout || 180) }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
